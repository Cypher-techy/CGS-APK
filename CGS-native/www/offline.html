<style>

  body {

    color: #fff;

    border-top: 1px solid rgba(255,255,255,.09); padding-top: 16px; line-height: 1.5;
  }
  button {
    margin-top: 24px; width: 100%; padding: 15px 20px;
    font: inherit; font-weight: 600; font-size: 15px;
    color: #0b0b0b; background: #fff; border: 0; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  button:active { transform: scale(.985); opacity: .9; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #e86b2a; }
  .status { margin-top: 12px; font-size: 12.5px; color: rgba(255,255,255,.4); min-height: 18px; }
</style>

  document.getElementById("retry").addEventListener("click", function () {
    if (navigator.onLine === false) {
      statusEl.textContent = "Still no connection.";
      return;
    }
    go();
  });

  window.addEventListener("online", go);
  // Belt and braces: poll while this page is visible.
  setInterval(function () {
    if (navigator.onLine && !document.hidden) { go(); }
  }, 5000);

  if (navigator.onLine) {
    statusEl.textContent = "Network detected — retrying…";
    setTimeout(go, 600);
  }
</script>
</body>
</html>
